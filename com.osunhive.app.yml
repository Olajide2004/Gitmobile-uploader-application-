AutoName: GitMobile Uploader
Summary: Mobile folder and file uploader for GitHub repositories
Description: |-
  GitMobile Uploader allows developers and content creators to commit and upload full folder
  structures and files directly to their GitHub repositories using the GitHub Git Trees & Commits API.
  
  Key features:
  * Upload complete folders using Android Storage Access Framework
  * Real-time dual-track upload progress indicators
  * Fast mode directory filters (.git, build, cache directories)
  * Remote link configuration via GitHub JSON
  * Integrated Osunhive news and tech updates
  * Pull-to-refresh for branches, repositories, and local folders

